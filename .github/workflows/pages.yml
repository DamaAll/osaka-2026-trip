name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure GitHub Pages is enabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")

          if [ "$status" = "404" ]; then
            echo "Pages site does not exist yet; attempting to create it in workflow mode."
            create_status=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
              -X POST "${headers[@]}" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "$api")
            cat /tmp/pages-create.json || true
            if [ "$create_status" != "201" ]; then
              echo "::error::Could not enable GitHub Pages automatically (HTTP ${create_status}). Open Settings > Pages once and choose GitHub Actions as the source."
              exit 1
            fi
          elif [ "$status" = "200" ]; then
            echo "Pages site already exists."
          else
            cat /tmp/pages.json || true
            echo "::error::Unexpected Pages API response: HTTP ${status}"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
