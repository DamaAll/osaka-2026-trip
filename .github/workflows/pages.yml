name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只在 404 時建立設定是不夠的：既有的 legacy（發佈 repo 根目錄）設定會回 200，
      # 於是這一步靜靜跳過，Actions 每次都綠燈，但上線的其實是未建置的原始碼。
      # 這裡必須連 build_type 也一起校正。
      - name: Ensure GitHub Pages builds from this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")
          if [ "$status" = "404" ]; then
            create_status=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
              -X POST "${headers[@]}" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "$api")
            test "$create_status" = "201"
          elif [ "$status" = "200" ]; then
            build_type=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type',''))")
            echo "current build_type: ${build_type}"
            if [ "$build_type" != "workflow" ]; then
              echo "switching Pages to workflow builds"
              update_status=$(curl -sS -o /tmp/pages-update.json -w "%{http_code}" \
                -X PUT "${headers[@]}" \
                -H "Content-Type: application/json" \
                -d '{"build_type":"workflow"}' \
                "$api")
              test "$update_status" = "204"
            fi
          else
            cat /tmp/pages.json || true
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vue app
        run: npm run build

      # data.js 已由 Vite 打包進 JS，manifest 會以 hash 檔名產出，sw.js 由
      # precache-service-worker plugin 寫入實際資產清單。這裡再 cp 一次根目錄的
      # 舊檔會把產生好的 sw.js 蓋掉，離線快取就會少掉 JS/CSS。只留 .nojekyll。
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Verify service worker precache survived the build
        run: |
          set -euo pipefail
          grep -q '"./index.html"' dist/sw.js
          grep -q '\.js"' dist/sw.js
          grep -q '\.css"' dist/sw.js
          ! grep -q '__PRECACHE_ASSETS__' dist/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
