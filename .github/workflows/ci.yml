name: Validate site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-mobile-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vue app
        run: npm run build
      # 必須與 pages.yml 一致：不要 cp 根目錄的舊 sw.js，那會蓋掉 plugin 產生的
      # precache 清單，離線快取就會少掉 JS/CSS，mobile 測試也會跟著紅。
      - name: Prepare production-like dist
        run: touch dist/.nojekyll
      - name: Verify expected output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -d dist/assets
          grep -q '"./index.html"' dist/sw.js
          grep -q '\.js"' dist/sw.js
          grep -q '\.css"' dist/sw.js
          ! grep -q '__PRECACHE_ASSETS__' dist/sw.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Review 375 / 390 / 430px layouts
        run: npm run test:mobile
